<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Links Collection</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-down { animation: slide-down 0.3s ease-out; }
  </style>
</head>
<body class="bg-gradient-to-br from-black via-[#1a1a2e] to-[#16213e] min-h-screen text-gray-100 py-12 px-4 font-sans">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-16">
      <h1 class="text-4xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
        My All Links
      </h1>
      <p class="text-gray-300 max-w-xl mx-auto">
        A collection of my important links. Click the copy icon to easily copy any link to your clipboard.
      </p>
    </header>

    <!-- Links grid -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-5"></main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2"></div>
  </div>

  <!-- Load data first -->
  <script src="data.js"></script>
  <!-- Then main script -->
  <script src="script.js"></script>
</body>
</html>
