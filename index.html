<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Links Collection</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-down { animation: slide-down 0.3s ease-out; }
    
    /* Custom styles for the header */
    .header-container {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .title-gradient {
      background: linear-gradient(to right, rgba(156, 163, 175, 0.9), rgba(209, 213, 219, 0.9));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
      margin: 1.5rem auto;
      width: 80%;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-black via-[#1a1a2e] to-[#16213e] min-h-screen text-gray-100 py-12 px-4 font-sans">
  <div class="max-w-4xl mx-auto">
    <!-- Redesigned Header with black opacity -->
    <header class="text-center header-container animate-slide-down">
      <div class="mb-4 inline-flex items-center justify-center w-16 h-16 rounded-full bg-black/40 backdrop-blur-sm">
        <i class="fas fa-link text-2xl text-gray-200"></i>
      </div>
      <h1 class="text-4xl font-bold mb-4 title-gradient">
        My All Links
      </h1>
      <div class="divider"></div>
      <p class="text-gray-300/90 max-w-xl mx-auto text-lg">
        A collection of my important links. Click the copy icon to easily copy any link to your clipboard.
      </p>
    </header>

    <!-- Links grid -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-5"></main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2"></div>
  </div>

  <!-- Load data first -->
  <script src="data.js"></script>
  <!-- Then main script -->
  <script src="script.js"></script>
</body>
</html>
